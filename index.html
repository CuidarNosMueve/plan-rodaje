<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan de rodaje</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rodaje">
<meta name="theme-color" content="#f6f3ee">
<script>/* Aplica el estilo guardado antes de pintar (sin parpadeo). */
try{ const k=JSON.parse(localStorage.getItem("rodaje-skin:"+location.pathname)||"{}"); if(k.s) document.documentElement.dataset.skin=k.s; if(k.a==="0") document.documentElement.classList.add("sin-aj"); }catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f6f3ee; --card:#ffffff; --ink:#1b1a17; --muted:#6b665d; --line:#e4ded3;
  --accent:#d9480f; --accent-soft:#fde8dc; --ok:#2b8a3e; --ok-soft:#e3f4e6; --new:#1864ab; --new-soft:#e1efff;
  --radius:14px; --on-accent:#fff; --on-ok:#fff;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141311; --card:#1f1d1a; --ink:#f1ede6; --muted:#a39d92; --line:#34302a;
    --accent:#ff7a3d; --accent-soft:#3a2217; --ok:#5fcf72; --ok-soft:#1b2e1f; --new:#6cb2ff; --new-soft:#172636; }
}
*{box-sizing:border-box}
html{scrollbar-width:none;-ms-overflow-style:none}
::-webkit-scrollbar{display:none;width:0;height:0}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:calc(env(safe-area-inset-top) + 6px) 16px 17px;border-bottom:0}
.sbar{position:absolute;left:0;right:0;bottom:0;height:14px;background:var(--line);pointer-events:none;overflow:hidden}
.sbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:0 14px 14px 0;transition:width .8s cubic-bezier(.2,.9,.25,1.15)}
.top{display:flex;align-items:center;gap:10px}
.top h1{min-width:0;overflow:hidden;font-size:19px;margin:0;flex:1;letter-spacing:-.01em;line-height:1.15}
.top h1 small{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.sub2{display:flex;align-items:center;gap:8px;margin-top:2px;min-width:0;white-space:nowrap}
.sub2 .yo{margin:0;vertical-align:baseline;flex:none}
.sub2 small{overflow:hidden;text-overflow:ellipsis}
#ttxt{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;height:36px;min-width:36px;padding:0 12px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;cursor:pointer}
.iconbtn:active{transform:scale(.97)}
#btnSync{position:relative}
.progress{margin-top:0;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:18px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.progress b{color:var(--ink)}
.avance{border:0;background:none;padding:2px 0 2px 4px;font-size:13px;line-height:1.3;color:var(--muted);font-variant-numeric:tabular-nums;cursor:pointer;white-space:nowrap;text-align:right}
.avance .vtot{text-transform:none;letter-spacing:0;font-weight:600}
.avance{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex:1;min-width:0}
.avance small{display:block;overflow:hidden;text-overflow:ellipsis;text-align:left;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.filters{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{margin:8px 16px 0;display:block;width:calc(100% - 32px);border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:16px}
main{padding:6px 12px calc(16px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.banner{margin:0 4px 12px;border-radius:var(--radius);background:var(--new-soft);color:var(--ink);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;border:1px solid color-mix(in srgb,var(--new) 30%,transparent)}
.banner b{color:var(--new)}
.banner p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.banner button{margin-left:auto;flex:none}
.linea{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 8px 8px}
.scene{scroll-margin-top:150px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.scene.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.shead{width:100%;display:flex;gap:12px;align-items:center;padding:13px 14px;background:none;border:0;text-align:left;cursor:pointer}
.num{flex:none;min-width:44px;height:44px;border-radius:11px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.scene.done .num{background:var(--ok-soft);color:var(--ok)}
.stitle{flex:1;min-width:0}
.stitle strong{display:block;font-size:16px;line-height:1.2}
.stitle span{display:block;font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{flex:none;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.count .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--new);margin-right:5px;vertical-align:1px}
.sbody{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.scene.open .sbody{display:block}
.story{font-size:14.5px;color:var(--muted);margin:12px 0 10px;font-style:italic}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin:0 0 10px}
.meta dt{color:var(--muted)} .meta dd{margin:0}
.maps{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.maps a{font-size:13px;text-decoration:none;color:var(--accent);background:var(--accent-soft);padding:5px 10px;border-radius:999px;font-weight:600}
.shots{list-style:none;margin:0;padding:0}
.shot{display:flex;align-items:flex-start;gap:12px;padding:7px 2px;border-top:1px solid var(--line)}
.shot:first-child{border-top:0}
.shot label{flex:1;display:flex;gap:12px;align-items:flex-start;cursor:pointer;min-height:28px}
.shot input{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);margin:0;display:grid;place-content:center;background:var(--card);cursor:pointer}
.shot input:checked{background:var(--ok);border-color:var(--ok)}
.shot input:checked::after{content:"";width:12px;height:7px;border:3px solid var(--on-ok);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.shot .txt{font-size:15.5px;padding-top:2px}
.shot .col{flex:1;min-width:0}
.shot.checked .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:2px;text-transform:uppercase}
.tag.ya{background:var(--ok-soft);color:var(--ok)}
.shot input:disabled{cursor:default;opacity:.85}
.tag.new{background:var(--new-soft);color:var(--new)} .tag.mine{background:var(--accent-soft);color:var(--accent)}
.del{flex:none;border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px;cursor:pointer}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:16px;min-width:0}
.add button{border:0;background:var(--ink);color:var(--bg);border-radius:10px;padding:0 14px;font-weight:700;cursor:pointer}
.mom{padding:14px 0 4px;border-top:1px solid var(--line)}
.mom:first-child{border-top:0}
.mhead{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;min-height:46px;overflow:hidden;padding-left:2px}
.mhead>*{flex:none}
.mhead .dur{flex:none;white-space:nowrap}
.mhead .cnt{white-space:nowrap}
.mhead .cnt .c{display:none}
.mhead.ap .cnt .l{display:none}.mhead.ap .cnt .c{display:inline}
.mhead.ap2 .dur .ic{display:none}
.mn .mc{display:none}.mhead.ap3 .mn .mw{display:none}.mhead.ap3 .mn .mc{display:inline}
.mhead .dur small{font-size:12px;font-weight:600;opacity:.8}
.apert{display:block;margin-top:6px;padding:7px 10px;border-radius:10px;font-size:13px;line-height:1.35;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--accent) 13%,transparent);border-left:4px solid var(--accent)}
.apert b{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:1px}
html[data-skin="neon"] .apert{border-radius:4px;border:1px solid var(--accent);border-left-width:4px;font-family:var(--mono);font-size:12px;box-shadow:0 0 12px rgba(0,229,255,.18)}
html[data-skin="cine"] .apert{border-radius:2px;font-family:Georgia,serif;font-style:italic;background:rgba(226,182,90,.1)}
html[data-skin="editorial"] .apert{border-radius:0;border:2px solid var(--accent);background:transparent;font-family:Georgia,serif}
html[data-skin="aurora"] .apert{border-radius:14px;border-left-width:0;background:linear-gradient(90deg,rgba(106,76,255,.14),rgba(255,79,134,.12))}
.dur.est{opacity:.75;font-style:italic}
.tag.gu{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);margin-left:6px}
.sbar.late{animation:late .6s ease-out}
@keyframes late{0%{transform:scaleY(1)}30%{transform:scaleY(1.35)}60%{transform:scaleY(.92)}100%{transform:scaleY(1)}}
.sbar{transform-origin:50% 100%}
.brote{position:fixed;z-index:9998;pointer-events:none;transform:translate(-50%,-50%);font:800 15px/1 -apple-system,system-ui,sans-serif;color:#fff;background:var(--accent);padding:4px 8px;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.2);animation:brote 1.25s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes brote{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-90%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-180%) scale(1)}100%{opacity:0;transform:translate(-50%,-240%) scale(.9)}}
html[data-skin="neon"] .brote{background:transparent;color:#eaffff;border:1px solid var(--accent);border-radius:3px;font-family:var(--mono);text-shadow:0 0 8px var(--accent);box-shadow:0 0 14px var(--accent),inset 0 0 10px rgba(0,229,255,.35)}
html[data-skin="cine"] .brote{background:linear-gradient(180deg,#f6dc9a,#b8893a);color:#1a140c;font-family:Georgia,serif;font-style:italic;box-shadow:0 0 22px rgba(226,182,90,.7)}
html[data-skin="editorial"] .brote{background:var(--bg);color:#e0201b;border:2px solid #e0201b;border-radius:0;font-family:Georgia,serif;transform:translate(-50%,-50%) rotate(-6deg)}
html[data-skin="aurora"] .brote{background:linear-gradient(90deg,#6a4cff,#ff4f86);box-shadow:0 6px 24px rgba(255,79,134,.45)}
.fiesta{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999}
.mom.festejo .mhead{animation:festejo 1.4s ease-out}
@keyframes festejo{0%{transform:scale(1)}15%{transform:scale(1.035)}35%{transform:scale(.99)}55%{transform:scale(1.01)}100%{transform:scale(1)}}
.sello{position:fixed;z-index:10000;pointer-events:none;transform:translate(-50%,-50%) rotate(-8deg) scale(2.2);opacity:0;font:900 26px/1 Georgia,serif;letter-spacing:.06em;text-transform:uppercase;color:#e0201b;border:4px double #e0201b;padding:8px 14px;background:rgba(251,250,246,.85);animation:sello 1.5s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes sello{0%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(2.2)}18%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}}
html[data-skin="neon"] .mom.festejo .mhead{box-shadow:0 0 0 1px var(--accent),0 0 28px var(--accent)}
html[data-skin="cine"] .mom.festejo .mhead{box-shadow:0 0 30px rgba(226,182,90,.5)}
.mom.cubierto{border-top-color:var(--ok);background:linear-gradient(90deg,color-mix(in srgb,var(--ok) 16%,transparent),color-mix(in srgb,var(--ok) 4%,transparent) 70%,transparent);box-shadow:inset 5px 0 0 var(--ok);filter:saturate(1.2) brightness(1.04)}
.mom.cubierto .mn{background:var(--ok);color:#fff}
html[data-skin="neon"] .mom.cubierto{background:linear-gradient(90deg,rgba(57,255,136,.14),rgba(57,255,136,.03) 70%,transparent);box-shadow:inset 4px 0 0 var(--ok),inset 0 0 38px rgba(57,255,136,.10);filter:brightness(1.12)}
html[data-skin="neon"] .mom.cubierto .mn{background:transparent;color:var(--ok);border-color:var(--ok);box-shadow:0 0 10px var(--ok)}
html[data-skin="cine"] .mom.cubierto{background:linear-gradient(90deg,rgba(226,182,90,.16),rgba(226,182,90,.03) 70%,transparent);box-shadow:inset 4px 0 0 var(--accent),inset 0 0 40px rgba(226,182,90,.08);filter:brightness(1.1)}
html[data-skin="cine"] .mom.cubierto .mn{background:var(--accent);color:var(--on-accent,#1a140c)}
html[data-skin="editorial"] .mom.cubierto{background:repeating-linear-gradient(135deg,rgba(0,0,0,.05) 0 2px,transparent 2px 7px);box-shadow:inset 7px 0 0 var(--ok);filter:none}
html[data-skin="aurora"] .mom.cubierto{background:linear-gradient(90deg,rgba(106,76,255,.14),rgba(255,79,134,.10) 60%,transparent);box-shadow:inset 5px 0 0 #a64cff;filter:saturate(1.25) brightness(1.04)}
html[data-skin="aurora"] .mom.cubierto .mn{background:linear-gradient(90deg,#6a4cff,#ff4f86);color:#fff}
.mhead.cubierto{background:linear-gradient(90deg,transparent 30%,var(--ok-soft));border-radius:12px}
.mhead .cnt.lleno{color:var(--ok);background:var(--ok-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ok) 45%,transparent);padding:3px 9px;border-radius:99px;font-weight:800}
.mn{white-space:nowrap;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:999px}
.mom.done .mn{color:var(--ok);background:var(--ok-soft)}
.dur{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.mom .cnt{white-space:nowrap;margin-left:auto;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.voz{margin:8px 0 6px;font-size:17px;line-height:1.35;font-weight:600}
.mas{flex:none;display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border:2px dashed var(--muted);background:none;border-radius:50%;font-size:28px;line-height:1;font-weight:400;color:var(--muted);cursor:pointer;padding:0}
.mas[aria-pressed="true"]{border-style:solid;color:var(--accent);border-color:var(--accent)}
.yabtn{display:block;margin:2px 0 0;border:0;background:none;padding:8px 2px;font-size:14px;font-weight:700;color:var(--ok);cursor:pointer}
.mom textarea{margin-top:8px;min-height:44px;resize:none;overflow:hidden}
.listo{margin-top:12px}
.vtit{display:block;width:100%;margin:0 0 4px;padding:4px 6px;background:none;border:0;text-align:center;font-size:18px;font-weight:800;cursor:pointer}
.vtit span{color:var(--muted)}
.desp{margin:0 4px 10px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;max-height:55vh;overflow-y:auto}
.tipos{display:flex;gap:8px;margin-bottom:10px;overflow-x:auto}
.navfijo{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.navfijo .navb{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.navfijo .navb:disabled{opacity:.35}
body.uno main{padding-bottom:0}
.espacio{height:calc(66px + env(safe-area-inset-bottom))}
body.uno .toast{bottom:calc(88px + env(safe-area-inset-bottom))}
.yo{display:inline-block;margin-left:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;vertical-align:2px;cursor:pointer;letter-spacing:0}
.yo[hidden]{display:none}
.navv,.navm{display:flex;align-items:center;gap:8px;margin:0 4px 8px}
.navt{flex:1;min-width:0;text-align:center;line-height:1.2}
.navt b{display:block;font-size:15px}.navt small{color:var(--muted);font-size:12px}
.navb{flex:none;min-width:92px;min-height:46px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;padding:0 10px}
.navm .navb{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.navb:disabled{opacity:.35;cursor:default}
.navv{padding-bottom:8px;border-bottom:1px solid var(--line)}
.modo{display:block;margin:16px auto 0;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;cursor:pointer}
body.uno .filters, body.uno .search{display:none}
.listo{display:block;width:100%;margin-top:14px;min-height:54px;border:2px solid var(--ok);background:var(--card);color:var(--ok);border-radius:14px;font-size:17px;font-weight:800;cursor:pointer}
.listo[aria-pressed="true"]{background:var(--ok);color:var(--on-ok)}
.info{margin:2px 0;font-size:13px;color:var(--muted)}
.info b{color:var(--ink);font-weight:700}
.mom .shots{margin-top:6px}
.mom .nl{display:block;margin-top:10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mom textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;line-height:1.35;resize:vertical;min-height:44px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.mom .nl small{font-weight:500;text-transform:none;letter-spacing:0;margin-left:6px}
.mom .fin{height:12px}
.prem{display:inline-block;margin:2px 0 8px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}.gcard p{margin:6px 0 4px;font-size:14px;line-height:1.4}.gcard small{color:var(--muted)}
.vgc.ed.on{background:#6d4bd8;border-color:#6d4bd8}.vg.ed{border-left:4px solid #6d4bd8}.etq.ed{background:#efe9fd;color:#4a2fa8}
.nombre.nuevo{border-style:dashed}
.mios{display:flex;gap:6px;align-items:center;justify-content:space-between;width:100%;margin:0 0 8px;padding:9px 12px;border:1.5px solid var(--accent);background:var(--card);border-radius:12px;font:inherit;font-size:14px;font-weight:700;color:inherit;text-align:left}.mios span{font-weight:500;color:var(--muted);font-size:12px}
.mv{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}.mv>b{display:block;margin-bottom:6px}.mv.ed{border-left:4px solid #6d4bd8}
.ginfo{margin:0 8px 10px;font-size:13px;color:var(--muted);line-height:1.4}
.gitem{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}.gitem .gt{font-size:16px;font-weight:700;margin-bottom:8px}
.gtk{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.35;cursor:pointer}
.gtk input{flex:none;width:24px;height:24px;margin:1px 0 0;accent-color:var(--ok)}.gtk small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.gtk.on span{color:var(--muted)}
.gnota{display:block;padding-top:8px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.gen{list-style:none;margin:0 0 10px;padding:0}.gen li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:15px;line-height:1.35}
.pm-over{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.pm-card{background:var(--card);color:var(--ink);border-radius:18px;padding:18px 18px 14px;width:100%;max-width:560px;max-height:80vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.pm-card h3{margin:0 0 10px;font-size:16px}.pm-card p{margin:0 0 14px;font-size:16px;line-height:1.5}.pm-card .vacio{color:var(--muted)}
.pm-card button{display:block;width:100%;height:44px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font:inherit;font-weight:700;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
.foot .vt{border:1px solid var(--line);border-radius:999px;padding:9px 16px;margin-bottom:6px;font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;background:var(--card)}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12px;cursor:pointer;padding:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(calc(100% + 140px + env(safe-area-inset-bottom)));opacity:0;visibility:hidden;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:18px;font-size:14px;line-height:1.35;font-weight:600;transition:transform .25s,opacity .25s,visibility 0s linear .25s;z-index:9;white-space:normal;text-align:center;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;box-shadow:0 8px 28px rgba(0,0,0,.25)}   /* el aviso puede ocupar 2–3 líneas: nunca se corta */
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;transition:transform .25s,opacity .25s,visibility 0s}
.spin{animation:spin 1s linear infinite;display:inline-block} @keyframes spin{to{transform:rotate(360deg)}}

/* ----- Equipo ----- */
.vistas{display:none;margin-top:6px;background:var(--line);border-radius:10px;padding:3px;gap:3px}
body.team .vistas{display:flex}
.vistas button{flex:1;border:0;background:none;border-radius:8px;padding:5px 0;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.vistas .vgen{flex:1.5;line-height:1.1;padding:4px 2px}
.vistas button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
body.vista-equipo .filters, body.vista-equipo .search{display:none}
.pend{position:absolute;right:-3px;bottom:-3px;background:var(--accent);color:#fff;border-radius:99px;font-size:9px;line-height:1;font-weight:700;min-width:14px;height:14px;padding:0 3px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;border:1.5px solid var(--bg);pointer-events:none}
.pend[hidden]{display:none}
.who{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.estado{margin:4px 8px 4px;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.estado .pt{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.estado.off .pt{background:var(--accent)}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px}
.pcard.tuyo{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.pcard .fila{display:flex;align-items:baseline;gap:8px}
.pcard strong{flex:1;font-size:16px}
.pcard .n{font-weight:800;font-variant-numeric:tabular-nums}
.pcard .bar{margin-top:2px}
.pcard .sub{margin-top:2px!important}
.pcard .sub{margin-top:6px;font-size:12.5px;color:var(--muted)}
.reciente{display:flex;width:100%;gap:10px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.reciente .num{min-width:38px;height:30px;font-size:13px;border-radius:8px}
.reciente .t{flex:1;min-width:0;font-size:14.5px}
.reciente .t small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.avisos{margin:0 4px 12px;border-radius:var(--radius);background:var(--accent-soft);padding:12px 14px;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.avisos b{color:var(--accent)} .avisos p{margin:3px 0 0;font-size:14px;color:var(--muted)}
.avisos .acc{display:flex;gap:8px;margin-top:10px}
.avisos.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent)} .avisos.ok b{color:var(--ok)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.modal h2{margin:0 0 4px;font-size:20px}
.modal p{margin:0 0 14px;color:var(--muted);font-size:14px}
.modal .nombre{display:block;width:100%;margin-bottom:8px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px;font-size:17px;font-weight:700;text-align:left;cursor:pointer}
.modal .nombre.sel{border-color:var(--accent);background:var(--accent-soft)}
.series{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 4px 0}
.serie{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:150px;background:var(--card);border:1px solid var(--line);border-radius:18px;cursor:pointer}
.serie b{font-size:56px;line-height:1;color:var(--accent);font-weight:800}
.serie span{font-size:15px;font-weight:700}.serie .tn{font-size:16px;font-weight:800;text-align:center;padding:2px 10px 0;line-height:1.15}.serie .tn+span{font-size:13px;font-weight:600;color:var(--muted)}
.tdesc{margin:2px 6px 12px;font-size:13px;line-height:1.4;color:var(--muted);text-align:center}.serie small{font-size:12.5px;color:var(--muted)}
.vrow{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 8px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:left;cursor:pointer}
.vrow.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.vrow .vn{flex:1;min-width:0;font-size:16px;font-weight:700}
.vrow .vc{flex:none;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.vrow.ok .num{background:var(--ok-soft);color:var(--ok)}
.navt .tv{display:block;width:100%;background:none;border:0;padding:0;cursor:pointer;font-size:15px;font-weight:800;line-height:1.2}
.navt .tv::after{content:" ▾";color:var(--muted)}
.modal .nombre.cancel{text-align:center;font-weight:600;color:var(--muted);background:none}
.vg{display:flex;align-items:center;gap:8px;margin:6px 0 2px;font-size:13px;color:var(--muted)}
.vg b{color:var(--ink)}
.etq{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:99px;background:var(--line);color:var(--muted);margin:0 0 0 6px;vertical-align:middle;white-space:nowrap}
.etq.mio{background:var(--accent);color:var(--on-accent)}
.etq.bq{background:none;padding:0 0 0 4px;margin:0}
.vrow .vn .etq, .stitle .etq{margin:3px 0 0;display:block;width:fit-content}
.vg.mio,.vg.aj{display:block;line-height:1.35}
.vg.mio{background:color-mix(in srgb,var(--accent) 12%,var(--card));border:1px solid var(--accent);border-radius:10px;padding:8px 10px;color:var(--ink)}
.vg.aj{background:var(--line);border-radius:10px;padding:8px 10px}
.vrow.resalt{}   /* sin contorno */
.vrow.opaco,.scene.opaco{opacity:.5}
.mom.opaco{opacity:.58;filter:saturate(.4)}
.vtit.opaco{opacity:.6}
.vrow.mio, .scene.mio{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--card))}
.scene.mio .shead{background:transparent}
.mom.mio{border-left:5px solid var(--accent)}
.vtit.mio{color:var(--accent)}
.vrow.ajeno, .scene.ajeno{opacity:.55}
.mom.ajeno{opacity:.62;filter:saturate(.35);border-style:dashed}
.vtit.ajeno{opacity:.6}
body.edicion .shot.ya .txt{font-weight:800}
.listo:disabled{opacity:.55;cursor:not-allowed}
.mom textarea[readonly]{opacity:.7;background:var(--line)}
.mas[hidden]{display:none}
.vrow .vg2{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:2px}


/* ================= ESTILOS (skins) ================= */
.skinbtn{padding:0;width:36px}
.skinpop{position:fixed;z-index:30;right:12px;top:calc(env(safe-area-inset-top) + 58px);width:min(330px,calc(100vw - 24px));padding:14px;border-radius:20px;
  background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.28);animation:skin-in .18s ease-out}
.skinpop[hidden]{display:none}
@keyframes skin-in{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.sk-row{display:flex;justify-content:space-between;gap:6px}
.sk{width:52px;height:52px;border-radius:50%;padding:3px;border:2px solid transparent;background:none;cursor:pointer;transition:transform .15s}
.sk:active{transform:scale(.92)}
.sk-op{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;padding:10px 2px 2px;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
.sk-op span{flex:1}.sk-op small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.sk-op i{flex:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.sk-op i::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.sk-op[aria-pressed="true"] i{background:var(--ok)}.sk-op[aria-pressed="true"] i::after{left:21px}
html.sin-aj :is(.vrow,.scene,.mom,.vtit):is(.ajeno,.opaco){opacity:1!important;filter:none!important;background-image:none!important;border-style:solid!important}
.sk[aria-pressed="true"]{border-color:var(--ink)}
.sk i{display:block;width:100%;height:100%;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)}
.sk[data-skin="papel"] i{background:conic-gradient(from 200deg,#f6f3ee 0 50%,#d9480f 50% 70%,#1b1a17 70%)}
.sk[data-skin="neon"] i{background:radial-gradient(circle at 30% 30%,#00e5ff 0 18%,transparent 19%),radial-gradient(circle at 72% 68%,#ff3df2 0 14%,transparent 15%),linear-gradient(135deg,#0b1020,#05060a);box-shadow:0 0 14px rgba(0,229,255,.45),inset 0 0 0 1px rgba(0,229,255,.5)}
.sk[data-skin="cine"] i{background:radial-gradient(circle at 50% 40%,#e2b65a 0 22%,#7a5a22 23% 30%,#0d0b09 31%)}
.sk[data-skin="editorial"] i{background:linear-gradient(90deg,#fbfaf6 0 50%,#0a0a0a 50%);box-shadow:inset 0 0 0 2px #0a0a0a,inset 0 -14px 0 0 #e10600}
.sk[data-skin="aurora"] i{background:radial-gradient(circle at 25% 30%,#b8a6ff,transparent 55%),radial-gradient(circle at 75% 35%,#ffc2d6,transparent 55%),radial-gradient(circle at 50% 80%,#a6f0e0,transparent 60%),#eef0ff}

/* ---- Al llegar a un video TUYO: toda la pantalla cambia de tono ---- */
body{transition:background-color .4s}
header{transition:box-shadow .4s}
html.mio-v .vtit{color:var(--accent)}
.vtit.llega{animation:llega .9s ease-out}
@keyframes llega{0%{transform:scale(.94);opacity:.2}40%{transform:scale(1.06);opacity:1}100%{transform:none}}
html.mio-v{--bg:#fdeee2;--line:#f0d2bd;--accent-soft:#fbd9c3}
@media (prefers-color-scheme: dark){html.mio-v:not([data-skin]){--bg:#241209;--line:#4a2a18;--accent-soft:#4a2616}}
html.mio-v[data-skin="neon"]{--bg:#0b0510;--accent:#ff3df2;--accent-soft:rgba(255,61,242,.13);--line:rgba(255,61,242,.28);--on-accent:#190018;--new:#00e5ff;--new-soft:rgba(0,229,255,.11)}
html.mio-v[data-skin="neon"] body::before{background:radial-gradient(60% 40% at 15% 0%,rgba(255,61,242,.2),transparent 70%),radial-gradient(50% 40% at 100% 100%,rgba(120,60,255,.2),transparent 70%),linear-gradient(rgba(255,61,242,.05) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(255,61,242,.05) 1px,transparent 1px) 0 0/28px 28px}
html.mio-v[data-skin="neon"] header{background:rgba(11,5,16,.78);box-shadow:0 10px 40px rgba(255,61,242,.2)}
html.mio-v[data-skin="neon"] .top h1{text-shadow:0 0 18px rgba(255,61,242,.6)}
html.mio-v[data-skin="neon"] .chip[aria-pressed="true"],html.mio-v[data-skin="neon"] .vistas button[aria-pressed="true"]{box-shadow:0 0 18px rgba(255,61,242,.6)}
html.mio-v[data-skin="cine"]{--bg:#1a0f05;--accent:#ffcb5c;--accent-soft:#3a2510;--line:#4a3418}
html.mio-v[data-skin="cine"] body::before{background:radial-gradient(120% 90% at 50% 0%,rgba(255,170,60,.22),transparent 60%),radial-gradient(140% 100% at 50% 50%,transparent 50%,rgba(0,0,0,.7))}
html.mio-v[data-skin="editorial"]{--bg:#ffece8;--line:#e8b8b0;--accent-soft:#ffd2cb}
html.mio-v[data-skin="editorial"] header{background:rgba(255,236,232,.97)}
html.mio-v[data-skin="aurora"]{--bg:#fdeaf3;--accent:#ff4f86;--accent-soft:rgba(255,79,134,.13)}
html.mio-v[data-skin="aurora"] body::before{filter:blur(40px) hue-rotate(-60deg) saturate(1.2)}
html.mio-v[data-skin="aurora"] .top h1{color:#e0306f}
html.mio-v[data-skin="aurora"] .navfijo .navb,html.mio-v[data-skin="aurora"] .navm .navb,html.mio-v[data-skin="aurora"] .chip[aria-pressed="true"],html.mio-v[data-skin="aurora"] .vistas button[aria-pressed="true"]{background:linear-gradient(135deg,#ff4f86,#ff8a5c);box-shadow:0 8px 20px rgba(255,79,134,.35)}


/* ===== Barras gruesas: estilo propio y efecto al avanzar (clase .sube) en cada estilo ===== */
.sbar i,.bar>i{position:relative;overflow:hidden}
.sbar i::after,.bar>i::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0}
.bar>i{transition:width .7s cubic-bezier(.2,.9,.25,1.15)}
/* Papel: píldora con rayas de caramelo; al avanzar, las rayas aceleran y pasa un brillo */
html:not([data-skin]) .sbar,html:not([data-skin]) .bar{box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
html:not([data-skin]) .sbar i,html:not([data-skin]) .bar>i{background-color:var(--accent);background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.28) 0 6px,transparent 6px 12px);background-size:17px 17px;animation:rayas 1.6s linear infinite}
html:not([data-skin]) .bar>i{background-color:var(--ok)}
html:not([data-skin]) .sube{animation-duration:.25s}
html:not([data-skin]) .sube::after{background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.85) 50%,transparent 80%);animation:barrido .7s ease-out}
@keyframes rayas{to{background-position:17px 0}}
@keyframes barrido{0%{opacity:1;transform:translateX(-100%)}100%{opacity:1;transform:translateX(100%)}}
/* Futurista: bloques de LED con brillo; al avanzar, la punta se enciende en blanco */
html[data-skin="neon"] .sbar,html[data-skin="neon"] .bar{background:rgba(0,229,255,.08);border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,229,255,.25)}
html[data-skin="neon"] .sbar i,html[data-skin="neon"] .bar>i{border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--ok));-webkit-mask:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 9px);mask:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 9px);filter:drop-shadow(0 0 4px var(--accent))}
html.mio-v[data-skin="neon"] .sbar i{background:linear-gradient(90deg,#ff3df2,#7a3cff)}
html[data-skin="neon"] .sube{animation:led .5s ease-out}
html[data-skin="neon"] .sube::after{left:auto;width:22px;background:linear-gradient(90deg,transparent,#fff);animation:punta .5s ease-out}
@keyframes led{0%{filter:drop-shadow(0 0 12px #fff) brightness(1.8)}100%{filter:drop-shadow(0 0 4px var(--accent)) brightness(1)}}
@keyframes punta{0%{opacity:1}100%{opacity:0}}
/* Cine: tira de película dorada con perforaciones; al avanzar, destello de proyector */
html[data-skin="cine"] .sbar,html[data-skin="cine"] .bar{background:#1c1712;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(226,182,90,.25)}
html[data-skin="cine"] .sbar i,html[data-skin="cine"] .bar>i{border-radius:2px;background:radial-gradient(circle,#0c0a08 1.2px,transparent 1.6px) 0 1px/7px 100% repeat-x,radial-gradient(circle,#0c0a08 1.2px,transparent 1.6px) 0 calc(100% - 1px)/7px 100% repeat-x,linear-gradient(180deg,#f6dc9a,#e2b65a 45%,#8a6a2c)}
html[data-skin="cine"] .sbar i{background:linear-gradient(180deg,#f6dc9a,#e2b65a 45%,#8a6a2c)}
html[data-skin="cine"] .bar>i{background-size:7px 4px,7px 4px,auto;background-position:0 1px,0 calc(100% - 1px),0 0;background-repeat:repeat-x,repeat-x,no-repeat}
html[data-skin="cine"] .sube{animation:proyector .6s steps(6)}
html[data-skin="cine"] .sube::after{background:linear-gradient(100deg,transparent 35%,rgba(255,248,220,.95) 50%,transparent 65%);animation:barrido .6s ease-in-out}
@keyframes proyector{0%,40%,80%{filter:brightness(1.5)}20%,60%,100%{filter:brightness(1)}}
/* Editorial: tinta con trama diagonal, recta y con borde; al avanzar, la punta se marca en rojo como un sello */
html[data-skin="editorial"] .sbar,html[data-skin="editorial"] .bar{background:transparent;border-radius:0;box-shadow:inset 0 0 0 2px var(--ink)}
html[data-skin="editorial"] .sbar{box-shadow:inset 0 -2px 0 var(--ink)}
html[data-skin="editorial"] .sbar i,html[data-skin="editorial"] .bar>i{border-radius:0;background:repeating-linear-gradient(45deg,var(--ink) 0 2px,transparent 2px 5px),var(--bg);box-shadow:inset 0 0 0 2px var(--ink)}
html[data-skin="editorial"] .sbar i{background:repeating-linear-gradient(45deg,var(--accent) 0 2px,transparent 2px 5px),var(--bg)}
html[data-skin="editorial"] .sube{animation:sacude .35s steps(3)}
html[data-skin="editorial"] .sube::after{left:auto;width:6px;background:var(--accent);animation:punta .7s steps(2)}
@keyframes sacude{0%{transform:translateY(-1px)}50%{transform:translateY(1px)}100%{transform:none}}
/* Aurora: luz líquida que fluye; al avanzar, florece un halo en la punta */
html[data-skin="aurora"] .sbar,html[data-skin="aurora"] .bar{background:rgba(106,76,255,.1);box-shadow:inset 0 1px 3px rgba(106,76,255,.15)}
html[data-skin="aurora"] .sbar i,html[data-skin="aurora"] .bar>i{background:linear-gradient(90deg,#6a4cff,#ff4f86,#ff8a5c,#6a4cff);background-size:300% 100%;animation:fluye 6s ease-in-out infinite alternate}
html.mio-v[data-skin="aurora"] .sbar i{background-image:linear-gradient(90deg,#ff4f86,#ff8a5c,#ffd36e,#ff4f86)}
html[data-skin="aurora"] .sube{animation:fluye 6s ease-in-out infinite alternate,florece .8s ease-out}
html[data-skin="aurora"] .sube::after{left:auto;width:40px;background:radial-gradient(circle at 100% 50%,rgba(255,255,255,.95),transparent 70%);animation:punta .8s ease-out}
@keyframes fluye{0%{background-position:0 0}100%{background-position:100% 0}}
@keyframes florece{0%{filter:saturate(1.8) brightness(1.3)}100%{filter:none}}
@media (prefers-reduced-motion:reduce){.sbar i,.bar>i,.sube,.sube::after{animation:none!important}}

/* ---- Futurista ---- */
html[data-skin="neon"]{--bg:#05060a;--card:rgba(16,21,34,.74);--ink:#e9f7ff;--muted:#8090a8;--line:rgba(110,200,255,.17);
  --accent:#00e5ff;--accent-soft:rgba(0,229,255,.11);--ok:#3dff9a;--ok-soft:rgba(61,255,154,.11);--new:#ff3df2;--new-soft:rgba(255,61,242,.11);

/* Teclado propio para «Seriales» (números, espacio, otro serial, letras) */

<script>
/* ===== CONFIGURACIÓN =====
   FUENTE: de dónde se descarga la lista actualizada.
   - "planos.json" → el archivo que está junto a esta app (lo editas tú y lo vuelves a subir).
   - O la URL de tu Google Sheet publicada como CSV
     (Archivo → Compartir → Publicar en la web → la hoja → "Valores separados por comas (.csv)").
*/
const FUENTE = "planos.json";
const CLAVE = "plan-rodaje-cst";

/* SYNC_URL: enlace de la "Aplicación web" de Apps Script (termina en /exec) para compartir checks entre el equipo.
   Lo normal es ponerlo en planos.json ("sync": "https://script.google.com/macros/s/…/exec"); esta constante es un respaldo.
   Si ambos están vacíos, la app funciona como antes: cada teléfono por separado. */
const SYNC_URL = "";
const EQUIPO = ["Valentina Hoyos","Alejandra Rivera","Jorge Girón"];

/* ===== Estado local (se guarda en este teléfono; con SYNC se comparte con el equipo) =====
   marcas:  { llave: {h:1|0, ts, q} }  último estado conocido de cada plano (h=grabado, q=quién, ts=cuándo)
   custom:  { escena: [{id,t,q,ts}] }  planos agregados por el equipo
   borrados:{ id: ts }                 planos agregados que ya se borraron
   cola:    eventos por enviar (se guardan hasta que haya señal) */
const base = JSON.parse(document.getElementById("datos-base").textContent);
const DEF = () => ({formato:2,modo:"inicio",serie:null,pos:null,avanceTotal:false,videoActual:null,notas:{},marcas:{},custom:{},nuevos:{},keys:null,sig:null,data:null,filtro:"Todos",ocultar:false,abiertas:{},
  persona:null,asig:{},aj:{},cola:[],borrados:{},pin:"",vista:"plan",vistoEn:0,adoptado:false,sub:null,avisosNo:false,deHoja:false});
let st = cargar();

function cargar(){
  let g={}; try{ g=JSON.parse(localStorage.getItem(CLAVE)||"{}"); }catch(e){}
  // Formato anterior (escenas y planos): se descarta el avance viejo, pero se conservan nombre, PIN y avisos.
  if(g.formato!==2) g={persona:g.persona,pin:g.pin,sub:g.sub,avisosNo:g.avisosNo};
  const s=Object.assign(DEF(),g); s.formato=2;   // al volver a abrir la app se queda donde iba (video y momento); solo empieza en el inicio la primera vez
  return s;
}
function guardar(){ try{ localStorage.setItem(CLAVE, JSON.stringify(st)); }catch(e){} cfgSW(); }
/* El service worker necesita el enlace del equipo (y el PIN) para pedir el texto de cada aviso. */
let cfgSWult="";
function cfgSW(){
  try{ if(!("caches" in window)) return; const u=(typeof data!=="undefined"&&data&&data.sync)||SYNC_URL||""; if(!u) return;
    const c=JSON.stringify({url:u,pin:st.pin||""}); if(c===cfgSWult) return; cfgSWult=c;
    caches.open("rodaje-cfg").then(x=>x.put("cfg",new Response(c))).catch(()=>{}); }catch(e){}
}

let data = st.data || base;
let swReg=null, recargandoSW=false, VERS="";   // actualización del programa (ver más abajo)
/* Usuario de prueba: ve videos FALSOS (no los del Sheet) para probar actualizaciones y avisos sin ensuciar el plan real. */
const NOM_PRUEBA="Usuario de prueba", esPrueba=()=>st.persona===NOM_PRUEBA;
function datosPrueba(){
  const real=st.data||base, mk=(v,nom,n,voz,pl)=>({id:"PRUEBA-"+v+"/"+n,video:"PRUEBA-"+v,nombre:nom,momento:String(n),voz,duracion:"",total:"",yaHay:[],planos:pl,color:"",premisa:"Video falso para probar la app.",responsable:"",editor:""});
  return {...real, momentos:[
    mk("A","Video de prueba A",1,"«Esto es una prueba de la app.»",["Plano de prueba A1","Plano de prueba A2","Plano de prueba A3"]),
    mk("A","Video de prueba A",2,"«Segundo momento de prueba.»",["Plano de prueba A4","Plano de prueba A5"]),
    mk("B","Video de prueba B",1,"«Otro video falso para probar avisos.»",["Plano de prueba B1","Plano de prueba B2","Plano de prueba B3"]),
    mk("B","Video de prueba B",2,"«Cierre del video de prueba.»",["Plano de prueba B4","Plano de prueba B5"])]};
}
if(esPrueba()) data=datosPrueba();
let aviso = null;
const urlSync = () => (data && data.sync) || SYNC_URL || "";
let NUEVOS=[];   // personas nuevas (escribieron su nombre con «Nuevo usuario»): salen para elegir y para asignar
function calcNuevos(){
  const base=(data && data.equipo && data.equipo.length ? data.equipo : EQUIPO), pri=n=>norm(n).split(" ")[0], tengo=new Set(base.map(pri)), out=[];
  const add=n=>{ n=String(n||"").trim(); if(!n||n=="Control"||n=="Hoja"||n=="Sin nombre"||n==NOM_PRUEBA) return; const k=pri(n); if(tengo.has(k)) return; tengo.add(k); out.push(n); };
  (st.extra||[]).forEach(add); if(st.persona) add(st.persona);
  for(const k in st.marcas) add(st.marcas[k].q);
  for(const k in st.notas) for(const t in st.notas[k]) add(st.notas[k][t].q);
  for(const e in st.custom) st.custom[e].forEach(c=>add(c.q));
  NUEVOS=out;
}
const equipo = () => (data && data.equipo && data.equipo.length ? data.equipo : EQUIPO).concat(NUEVOS);
const equipoActivo = () => !!urlSync() && !!st.persona;
let GENC={}, PK={};   // GENC: planos cubiertos con una toma de un plano genérico {llave del plano → marca}; PK: llave → {momento, plano}
const marcaDe = k => st.marcas[k] || GENC[k] || null;
const hecho = k => k.startsWith("ya::") || !!(st.marcas[k] && st.marcas[k].h) || !!GENC[k];   // «ya::…» = plano que ya estaba grabado (columna «Ya hay»)
const corto = n => String(n||"").split(" ")[0];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
let cambiando=false, errorSync=false, girando=0;
const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const instalada = () => navigator.standalone===true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
function gira(d){ girando+=d; document.getElementById("syncIco").className = girando>0 ? "spin" : ""; }

const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
const llave = (esc, txt) => esc + "::" + norm(txt);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function firma(d){ return JSON.stringify(d.momentos.map(m=>[m.id,m.nombre,m.momento,m.voz,m.duracion,m.total,m.yaHay,m.editados,m.planos])); }
/* «Nuevo» solo para planos propuestos que aparecen en la hoja; los que vienen de «Plano del guion» entran sin etiqueta (son opciones extra, no una lista nueva). */
function todasLlaves(d){ const k=[]; d.momentos.forEach(m=>{ const gu=new Set(m.guion||[]); m.planos.forEach(p=>{ if(!gu.has(p)) k.push(llave(m.id,p)); }); }); return k; }
const momento = id => data.momentos.find(m=>m.id==id);

/* ===== Buscar actualización ===== */
let buscando=false;
async function sincronizar(manual){
  if(manual) revisarPrograma();
  if(buscando) return; buscando=true; gira(1);
  try{
    // 1) planos.json: configuración (enlace de sync, nombres…) y lista de respaldo
    let cfg=null;
    try{
      const r = await fetch(FUENTE + (FUENTE.includes("?")?"&":"?") + "t=" + Date.now(),{cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      cfg = await r.json();
      if(cfg && !cfg.momentos) cfg={...cfg,momentos:data.momentos};   // archivo con otro formato: solo se usa la configuración
    }catch(e){ if(!urlSync()) throw e; }
    // 2) Si hay Apps Script, la lista sale de la pestaña del desglose en el Google Sheet
    let nueva=cfg; const url=(cfg&&cfg.sync)||urlSync();
    if(url){
      let L=null;
      try{ L=await traerLista(url); }catch(e){ if(st.deHoja||!cfg) throw e; }
      if(L && L.ok && L.momentos && L.momentos.length){ nueva={...(cfg||data), momentos:L.momentos, genericos:L.genericos||[], version:L.version||(cfg||data).version}; st.deHoja=true; }
      else if(st.deHoja||!cfg){ if(L&&L.error=="pin") pedirPin(); throw new Error("lista no disponible"); }
    }
    aplicar(nueva, manual);
  }catch(e){
    if(st.sig==null) aplicar(data,false);
    if(manual) toast(navigator.onLine===false ? "Sin internet · usando la última lista" : "No se pudo revisar la lista");
  }finally{ buscando=false; gira(-1); sincEquipo(manual); }
}
async function traerLista(url){
  const r = await fetch(url+(url.includes("?")?"&":"?")+"accion=lista&pin="+encodeURIComponent(st.pin||"")+"&t="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
function pedirPin(){ setTimeout(()=>{ const p=prompt("PIN del equipo"); if(p!=null){ st.pin=p.trim(); guardar(); sincronizar(true); } },0); }
function aplicar(nueva, manual){
  if(esPrueba()){ if(manual) toast("Modo prueba: usas videos falsos"); return; }   // en modo prueba no se cambia la lista
  // El enlace de sincronización y los nombres del equipo viajan en la lista, pero no cuentan como "lista nueva".
  if((nueva.genericos!==undefined && JSON.stringify(nueva.genericos)!==JSON.stringify(data.genericos||[])) || nueva.sync!==data.sync || nueva.vapid!==data.vapid || JSON.stringify(nueva.equipo)!==JSON.stringify(data.equipo) || JSON.stringify(nueva.tipos)!==JSON.stringify(data.tipos)){
    data={...data, sync:nueva.sync, vapid:nueva.vapid, equipo:nueva.equipo, tipos:nueva.tipos, genericos:nueva.genericos!==undefined?nueva.genericos:data.genericos}; st.data=data; guardar(); render();
  }
  { const ok=new Set(todasLlaves(nueva)); let hubo=false; Object.keys(st.nuevos).forEach(x=>{ if(!ok.has(x)){ delete st.nuevos[x]; hubo=true; } }); if(hubo){ guardar(); render(); } }   // quita «Nuevo» de planos que ya no cuentan (p. ej. los del guion)
  const sig=firma(nueva);
  if(sig===st.sig){

/* ===== Eventos: marcar · desmarcar · agregar · borrar =====
   ev = {evid, ts, quien, tipo, id, escena, texto}. Gana siempre el más reciente (por ts) de cada plano. */
function aplicarEv(ev){
  const id=ev.id;
  if(ev.tipo=="marcar"||ev.tipo=="desmarcar"){
    const m=st.marcas[id]; if(m && m.ts>=ev.ts) return false;
    st.marcas[id]={h:ev.tipo=="marcar"?1:0, ts:ev.ts, q:ev.quien||null}; if(id.startsWith("gen::")) st.marcas[id].t=ev.texto||"";
    if(ev.tipo=="marcar") delete st.nuevos[id];
    return true;
  }
  if(ev.tipo=="seriales"||ev.tipo=="comentario"){
    const n=(st.notas[id] ||= {}), a=n[ev.tipo]; if(a && a.ts>=ev.ts) return false;
    n[ev.tipo]={t:ev.texto||"", ts:ev.ts, q:ev.quien||null}; return true;
  }
  if(ev.tipo=="asignar"){
    const a=st.asig[id]; if(a && a.ts>=ev.ts) return false;
    st.asig[id]={n:ev.texto||"", ts:ev.ts}; return true;
  }
  if(ev.tipo=="ajuste"){
    const a=st.aj[id]; if(a && a.ts>=ev.ts) return false;
    st.aj[id]={v:ev.texto||"", ts:ev.ts}; return true;
  }
  if(ev.tipo=="agregar"){
    if(st.borrados[id]) return false;
    const l=(st.custom[ev.escena] ||= []);
    if(l.some(c=>c.id==id)) return false;
    l.push({id, t:ev.texto, q:ev.quien||null, ts:ev.ts}); return true;
  }
  if(ev.tipo=="borrar"){
    if(st.borrados[id]) return false;
    st.borrados[id]=ev.ts; let hubo=false;
    for(const e in st.custom){ const n=st.custom[e].length; st.custom[e]=st.custom[e].filter(x=>x.id!=id); if(st.custom[e].length!=n) hubo=true; }
    return hubo;
  }
  return false;
}

/* ===== Sincronización con el equipo (Google Apps Script) ===== */
let enviando=false, tEmpuje, tReintento;
function empujar(){ clearTimeout(tEmpuje); tEmpuje=setTimeout(()=>sincEquipo(false),350); }
async function sincEquipo(manual){
  const url=urlSync(); if(!url||!st.persona) return;
  if(enviando) return; enviando=true; gira(1);
  let pinMalo=false;
  try{
    do{
      const lote=st.cola.slice(0,200);
      const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),20000); let j;
      try{
        // text/plain evita la consulta previa (preflight) que Apps Script no responde.
        const r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
          body:JSON.stringify({pin:st.pin||"",eventos:lote}),signal:ctl.signal});
        if(!r.ok) throw new Error("HTTP "+r.status);
        j=await r.json();
      } finally { clearTimeout(to); }
      if(j.error=="pin"){ pinMalo=true; throw new Error("pin"); }
      if(!j.ok) throw new Error(j.error||"error");
      const ids=new Set(lote.map(e=>e.evid)); st.cola=st.cola.filter(e=>!ids.has(e.evid));
      (j.eventos||[]).forEach(aplicarEv);
      st.vistoEn=Date.now(); errorSync=false; guardar();
    } while(st.cola.length);
  }catch(e){
    errorSync=true;
    if(manual && !pinMalo) toast(navigator.onLine===false ? "Sin señal · se enviará cuando vuelva" : "No se pudo sincronizar con el equipo");
    if(st.cola.length){ clearTimeout(tReintento); tReintento=setTimeout(()=>sincEquipo(false),20000); }
  }finally{
    enviando=false; gira(-1); render();
  }
  if(pinMalo){ const p=prompt("PIN del equipo"); if(p!=null){ st.pin=p.trim(); guardar(); sincEquipo(true); } }
}

/* Duración del momento: columna «Duración (aprox.)»; si está vacía, se calcula del rango de la voz («28–33 s»). */
function durDe(m){
  let d=(m.duracion||"").trim();
  if(!d){ const x=/(\d+)\s*[–-]\s*(\d+)\s*s/.exec(m.voz||""); if(x && +x[2]>+x[1]) d=(+x[2]-+x[1])+" s"; }
  if(!d) d=durEstimada(m.voz);

/* Segundos de la duración (acepta «3,5 s», «10.9 s»…) o null */
/* Sin «Duración» en la hoja: se estima por las palabras de la voz en off (calibrado con el video 1-2: ≈0,6 s + 0,3 s por palabra). Va con «≈». */
function durEstimada(voz){
  const w=(voz||"").replace(/[«»“”"()]/g," ").replace(/\d+\s*[–-]\s*\d+\s*s/g," ").split(/\s+/).filter(x=>/[\p{L}\d]/u.test(x)).length;
  if(!w) return ""; const s=Math.max(1.5,Math.round((0.6+0.3*w)*2)/2);
  return "≈"+String(s).replace(".",",")+" s";
}
function segDe(d){ const n=/^\s*≈?\s*(\d+(?:[.,]\d+)?)\s*s/.exec(d||""); return n?parseFloat(n[1].replace(",",".")):null; }

function necesarios(d){ const s=segDe(d); return s==null?null:Math.max(1,Math.round(s/segPlano())); }

/* ===== Vista Equipo ===== */
function statsEquipo(){
  const por={}, ensure=n=>por[n]||(por[n]={n,hechos:0,cred:0,listos:0,agregados:0,ult:0});
  equipo().forEach(ensure);
  let total=0; const recientes=[];
  MOMS().forEach(e=>{
    const it=planosDe(e), necs=necesarios(durDe(e)), fijos=it.filter(i=>i.fijo).length, marcados=[];
    total+=necs!=null?necs:it.length;
    it.forEach(i=>{ const m=marcaDe(i.k);
      if(m && m.h){ const p=ensure(m.q=="Control"?"Administrador":(m.q||"Sin nombre")); p.hechos++; p.ult=Math.max(p.ult,m.ts); recientes.push({e,i,m}); marcados.push(m); }
      if(i.mine && i.q) ensure(i.q).agregados++;
    });
    // la barra de cada persona solo recibe crédito por los planos que faltaban para la meta: los de más no suman
    let cupo=necs!=null?Math.max(0,necs-fijos):Infinity;
    marcados.sort((x,y)=>x.ts-y.ts).forEach(m=>{ if(cupo>0){ ensure(m.q=="Control"?"Administrador":(m.q||"Sin nombre")).cred++; cupo--; } });
  });
  for(const k in st.marcas){ const m=st.marcas[k]; if(k.startsWith('listo::') && m.h){ const p=ensure(m.q||'Sin nombre'); p.listos++; p.ult=Math.max(p.ult,m.ts); } }
  recientes.sort((a,b)=>b.m.ts-a.m.ts);
  return {por:Object.values(por).filter(p=>equipo().includes(p.n)), total, recientes};   // quien ya no está en el equipo (p. ej. marcas viejas) no sale como tarjeta
}

  h+=`<div class="linea">Últimos grabados</div>`;

const TEC={el:null,t:null,abc:false};
function tecHTML(){
  const keys=TEC.abc?"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789".split(""):["1","2","3","4","5","6","7","8","9","-","0","/"];
  return `<div class="tk-grid${TEC.abc?" abc":""}">${keys.map(k=>`<button type="button" data-tk="${k}">${k}</button>`).join("")}</div>
    <div class="tk-side"><button type="button" data-tkx="del" aria-label="Borrar">⌫</button><button type="button" data-tkx="sp">espacio</button><button type="button" data-tkx="nl">↵ Otro serial</button><button type="button" data-tkx="abc">${TEC.abc?"123":"ABC"}</button><button type="button" class="ok" data-tkx="ok">Listo</button></div>`;
}
function tecEnviar(){ const t=TEC.t; if(t) t.dispatchEvent(new Event("input",{bubbles:true})); }
function tecMostrar(ta){
  if(!TEC.el){ TEC.el=document.createElement("div"); TEC.el.id="teclado"; document.body.appendChild(TEC.el);
    TEC.el.addEventListener("pointerdown",ev=>{ ev.preventDefault(); const b=ev.target.closest("button"); if(!b||!TEC.t) return;
      const t=TEC.t, a=t.selectionStart==null?t.value.length:t.selectionStart, z=t.selectionEnd==null?a:t.selectionEnd;
      if(b.dataset.tk!==undefined){ t.setRangeText(b.dataset.tk,a,z,"end"); tecEnviar(); return; }
      const x=b.dataset.tkx;
      if(x=="sp"){ t.setRangeText(" ",a,z,"end"); tecEnviar(); }
      else if(x=="nl"){ const v=t.value; const sep=v&&!/\n$/.test(v.slice(0,a))?"\n":""; t.setRangeText(sep,a,z,"end"); tecEnviar(); }
      else if(x=="del"){ let c=a; if(a===z&&a>0) c=a-1; t.setRangeText("",c,z,"end"); tecEnviar(); }
      else if(x=="abc"){ TEC.abc=!TEC.abc; TEC.el.innerHTML=tecHTML(); }
      else if(x=="ok"){ const g=t; tecOcultar(); g.blur(); }
    });
    TEC.el.addEventListener("click",ev=>ev.preventDefault());
  }
  TEC.t=ta; TEC.el.innerHTML=tecHTML(); TEC.el.hidden=false; document.body.classList.add("con-tec");
  setTimeout(()=>{ try{ ta.scrollIntoView({block:"center",behavior:"smooth"}); }catch(e){} },60);
}
function tecOcultar(){ if(TEC.el) TEC.el.hidden=true; document.body.classList.remove("con-tec"); TEC.t=null; }

(function(){
  const el=document.createElement("div"); el.id="ptr"; el.innerHTML="<span></span>"; document.body.appendChild(el);
  const tx=el.firstChild; let y0=0, d=0, activo=false;
  const poner=(d,t)=>{ tx.textContent=t; el.classList.add("on"); el.style.transform="translateY("+Math.min(d*0.45,50)+"px)"; };
  const ocultar=()=>{ el.classList.remove("on"); el.style.transform="translateY(-60px)"; };
  document.addEventListener("touchstart",ev=>{
    if(window.scrollY>1||ev.touches.length!=1||(ev.target.closest&&ev.target.closest("textarea,input,select,#teclado,.modal,#modal *"))||document.body.classList.contains("con-tec")){ activo=false; return; }
    activo=true; y0=ev.touches[0].clientY; d=0; },{passive:true});
  document.addEventListener("touchmove",ev=>{ if(!activo) return; d=ev.touches[0].clientY-y0;
    if(window.scrollY>1||d<=8){ if(d<=8) ocultar(); return; }
    poner(d, d>85?"↓ Suelta para actualizar":"↓ Jala para actualizar"); },{passive:true});
  document.addEventListener("touchend",()=>{ if(!activo) return; activo=false;
    if(d>85){ poner(85,"Actualizando…"); try{ sincronizar(true); }catch(e){} revisarPrograma(); setTimeout(ocultar,1400); } else ocultar(); d=0; },{passive:true});
  document.addEventListener("touchcancel",()=>{ activo=false; ocultar(); },{passive:true});
})();

/* Compartir = «sábana de montaje»: por video y momento, solo lo ya grabado (planos marcados, extras del equipo, seriales, notas, listo). */
function sabanaMontaje(){
  const ctl=esControl(), L=[], vids=[...new Set(MOMS().map(m=>m.video))]; let nM=0,nP=0;
  const una=t=>String(t||"").replace(/\s*\n\s*/g," · ").trim();
  vids.forEach(v=>{
    const ms=MOMS().filter(m=>m.video==v), B=[];
    ms.forEach(m=>{
      const it=planosDe(m), gr=it.filter(i=>!i.fijo&&hecho(i.k)), ya=it.filter(i=>i.fijo&&!i.ed), ed=ctl?it.filter(i=>i.ed):[];
      const s=notaDe(m.id,"seriales"), c=notaDe(m.id,"comentario"), lk=st.marcas[listoK(m.id)], listo=!!(lk&&lk.h);
      if(!gr.length&&!listo&&!s&&!c) return;
      nM++; nP+=gr.length;
      const d=durDe(m);
      B.push("");
      B.push(`Momento ${m.momento}${d?" · "+d:""}${listo?" · ✓ LISTO"+(lk.q?" ("+corto(lk.q)+")":""):""}`);
      if(m.voz) B.push(`  Voz: ${una(m.voz)}`);
      gr.forEach(i=>{ const mk=marcaDe(i.k); B.push(`  ✓ ${i.t}${i.mine?" [extra]":""}${GENC[i.k]?" [genérico]":""}${mk&&mk.q?" — "+corto(mk.q)+", "+hora(mk.ts):""}`); });
      ya.forEach(i=>B.push(`  ● ${i.t} [ya existía]`));
      ed.forEach(i=>B.push(`  ● ${i.t} [en edición]`));
      if(s) B.push(`  Seriales: ${una(s)}`);
      if(c) B.push(`  Nota: ${una(c)}`);
    });
    if(B.length){ const vg=vgs(v); L.push("", `══ VIDEO ${v} · ${ms[0].nombre}${vg.length?" · "+listaNombres(vg,true):""}`); L.push(...B); }
  });
  if(!nM) return "";
  return `${data.proyecto} — SÁBANA DE MONTAJE\n${new Date().toLocaleString("es-CO",{weekday:"long",day:"numeric",month:"long",hour:"numeric",minute:"2-digit"})}\n${nM} momentos con material · ${nP} planos grabados`+L.join("\n");
}

  const i=document.querySelector("#sbar i"); if(!i) return;
  const w=tot?h/tot*100:0; i.style.width=w+"%"; document.getElementById("sbar").title=`${h} de ${tot} planos`;
  if(sbarPrev && sbarPrev.key===key && h>sbarPrev.h){ subir(i,true); brote(i,"+"+(h-sbarPrev.h)); }
  sbarPrev={key,h};
}
/* «+1» que sale de la punta de la barra al crecer; cada estilo lo pinta distinto */
function brote(i,txt){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r=i.getBoundingClientRect(), b=document.createElement("span"); b.className="brote"; b.textContent=txt;
  b.style.left=Math.min(innerWidth-24,Math.max(24,r.right))+"px"; b.style.top=(r.top+r.height/2)+"px"; document.body.appendChild(b); setTimeout(()=>b.remove(),1300);
}
/* Efecto de avance: se reinicia solo si la animación anterior ya terminó, para no parpadear al desplazar */
function subir(i,fuerte){ if(i._sube){ clearTimeout(i._sube); i.classList.remove("sube"); void i.offsetWidth; } i.classList.add("sube"); if(fuerte){ i.parentNode.classList.remove("late"); void i.offsetWidth; i.parentNode.classList.add("late"); } i._sube=setTimeout(()=>{ i.classList.remove("sube"); i.parentNode.classList.remove("late"); i._sube=null; },1100); }
const barrasPrev={}, barrasHasta={};
function animarBarras(){
  const vistas={};
  document.querySelectorAll(".bar>i").forEach(i=>{
    const c=i.closest(".pcard"), nom=c&&c.querySelector("strong"), base=(c?c.className.split(" ")[0]:"x")+"|"+(nom?nom.textContent:"");
    vistas[base]=(vistas[base]||0)+1; const key=base+"|"+vistas[base], w=parseFloat(i.style.width)||0, p=barrasPrev[key]; barrasPrev[key]=w;
    if(p!=null && w>p){ i.style.transition="none"; i.style.width=p+"%"; void i.offsetWidth; i.style.transition=""; i.style.width=w+"%"; barrasHasta[key]=Date.now()+1100; setTimeout(()=>{ if(i.isConnected) brote(i,"▲"); },500); }
    if(barrasHasta[key]>Date.now()){ i.classList.add("sube"); setTimeout(()=>i.classList.remove("sube"),barrasHasta[key]-Date.now()); }   // sobrevive a repintados (p. ej. la sincronización)
  });
}

/* ===== Celebración: cuando un momento llega a los planos suficientes (regla de 2 s), cada estilo tiene su efecto ===== */
let visPrev=new Set(), festejar=false;   // solo se celebra lo que marcas tú en este teléfono, no lo que llega por sincronización
/* Si la fila del momento no cabe en ESTE teléfono (otra tipografía, pantalla angosta), acorta los letreros: primero quita el ⏱, luego «Momento 6» → «M6» y, solo si aún no cabe, «✓ suficientes» → «✓». Nada queda cortado ni cambia la altura. */
function ajustarMhead(){
  document.querySelectorAll(".mhead").forEach(h=>{
    h.classList.remove("ap","ap2","ap3");
    for(const c of ["ap2","ap3","ap"]){ if(h.scrollWidth<=h.clientWidth) break; h.classList.add(c); }   // orden: quitar ⏱, «Momento»→«M», y solo al final «suficientes»→«✓»
  });
}
addEventListener("resize",ajustarMhead);
function revisarCubiertos(){
  ajustarMhead();
  // Cada vez que un momento que ya cumple su tiempo APARECE (abrir la app, abrir el video, volver a él, marcar el plano que lo completa) sale el efecto.
  const vis=[...document.querySelectorAll(".mom.cubierto")].filter(el=>el.offsetParent).map(el=>el.dataset.id);
  const nuevos=vis.filter(id=>!visPrev.has(id)), marcando=festejar; festejar=false; visPrev=new Set(vis);
  if(esControl()||!nuevos.length) return;
  const m=momento(nuevos[0]); celebrar(document.querySelector(`.mom[data-id="${CSS.escape(nuevos[0])}"]`));
  toast(`🎯 ${m.video} · Momento ${m.momento}: ${marcando?"ya hay planos suficientes":"ya cumple su tiempo"}. Puedes seguir grabando o marcarlo listo.`,4200);
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ visPrev=new Set(); revisarCubiertos(); } });
function celebrar(el){
  const sk=document.documentElement.dataset.skin||"papel", W=innerWidth, H=innerHeight;
  const rc=el?el.getBoundingClientRect():null, ox=rc?Math.min(W-30,Math.max(30,rc.right-60)):W/2, oy=rc?Math.min(H-40,Math.max(60,rc.top+22)):H/3;
  if(el){ el.classList.remove("festejo"); void el.offsetWidth; el.classList.add("festejo"); setTimeout(()=>el.classList.remove("festejo"),1600); }
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=document.createElement("canvas"), dpr=Math.min(2,devicePixelRatio||1); cv.className="fiesta"; cv.width=W*dpr; cv.height=H*dpr; document.body.appendChild(cv);
  const g=cv.getContext("2d"); g.scale(dpr,dpr);
  const R=(a,b)=>a+Math.random()*(b-a), P=[], pick=a=>a[Math.random()*a.length|0];
  let grav=.22, drag=.985, dur=2600, glow=0, extra=null;
  if(sk=="neon"){ grav=.03; drag=.955; glow=14; dur=1900;
    for(let i=0;i<80;i++){ const a=R(0,6.283), v=R(3,11); P.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:R(1.5,3),c:pick(["#00e5ff","#ff3df2","#39ff88","#ffffff"]),f:"streak"}); }
    extra=(k)=>{ for(let j=0;j<3;j++){ const p=k-j*.12; if(p<=0||p>=1) continue; g.strokeStyle=`rgba(0,229,255,${(1-p)*.8})`; g.lineWidth=2; g.shadowBlur=18; g.shadowColor="#00e5ff"; g.beginPath(); g.arc(ox,oy,p*Math.max(W,H)*.55,0,6.283); g.stroke(); } };
  } else if(sk=="cine"){ grav=.035; drag=.995; glow=8; dur=3200;
    for(let i=0;i<70;i++) P.push({x:R(0,W),y:R(-H*.4,0),vx:R(-.4,.4),vy:R(.6,2),s:R(1.5,4),c:pick(["#e2b65a","#f6dc9a","#fff3d1","#b8893a"]),f:"star",tw:R(0,6)});
    extra=(k)=>{ const a=Math.sin(Math.min(1,k*1.6)*Math.PI)*.22, rg=g.createRadialGradient(ox,oy,0,ox,oy,W*.8); rg.addColorStop(0,`rgba(255,220,150,${a})`); rg.addColorStop(1,"rgba(255,220,150,0)"); g.fillStyle=rg; g.fillRect(0,0,W,H); };
  } else if(sk=="editorial"){ grav=.28; drag=.98; dur=2400;
    for(let i=0;i<55;i++) P.push({x:R(0,W),y:R(-60,-10),vx:R(-1.5,1.5),vy:R(1,4),s:R(5,10),c:pick(["#111","#111","#e0201b","#fbfaf6"]),f:"strip",r:R(0,6),vr:R(-.2,.2)});
    const sello=document.createElement("div"); sello.className="sello"; sello.textContent="¡Suficientes!"; sello.style.left=ox+"px"; sello.style.top=oy+"px"; document.body.appendChild(sello); setTimeout(()=>sello.remove(),1500);
  } else if(sk=="aurora"){ grav=-.05; drag=.99; dur=3000;
    for(let i=0;i<40;i++) P.push({x:ox+R(-80,80),y:oy+R(-10,30),vx:R(-1.2,1.2),vy:R(-2.5,-.5),s:R(5,16),c:pick(["106,76,255","255,79,134","255,138,92","120,200,255"]),f:"orb"});
  } else {
    for(let i=0;i<110;i++){ const a=R(-2.6,-.55), v=R(6,14); P.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:R(5,9),c:pick(["#e4572e","#2e8b57","#f2c14e","#3a7bd5","#c94fbf"]),f:"rect",r:R(0,6),vr:R(-.3,.3)}); }
  }
  const t0=performance.now();
  (function paso(t){
    const k=(t-t0)/dur; g.clearRect(0,0,W,H); if(extra) extra(k); g.shadowBlur=glow;
    const al=k<.75?1:Math.max(0,(1-k)/.25);
    for(const p of P){ p.vx*=drag; p.vy=p.vy*drag+grav; p.x+=p.vx; p.y+=p.vy; if(p.vr) p.r+=p.vr;
      g.globalAlpha=al;
      if(p.f=="rect"||p.f=="strip"){ g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.scale(1,Math.cos(p.r*2)); g.fillStyle=p.c; if(p.f=="strip"){ g.fillRect(-p.s/2,-1.5,p.s,3); } else g.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66); g.restore(); }
      else if(p.f=="streak"){ g.strokeStyle=p.c; g.shadowColor=p.c; g.lineWidth=p.s; g.lineCap="round"; g.beginPath(); g.moveTo(p.x,p.y); g.lineTo(p.x-p.vx*3,p.y-p.vy*3); g.stroke(); }
      else if(p.f=="star"){ const s=p.s*(.6+.4*Math.sin(t/120+p.tw)); g.fillStyle=p.c; g.shadowColor=p.c; g.beginPath(); for(let j=0;j<8;j++){ const rr=j%2?s*.35:s*1.6, a=j*Math.PI/4; g.lineTo(p.x+Math.cos(a)*rr,p.y+Math.sin(a)*rr); } g.fill(); }
      else if(p.f=="orb"){ const rg=g.createRadialGradient(p.x,p.y,0,p.x,p.y,p.s); rg.addColorStop(0,`rgba(${p.c},.75)`); rg.addColorStop(1,`rgba(${p.c},0)`); g.fillStyle=rg; g.beginPath(); g.arc(p.x,p.y,p.s,0,6.283); g.fill(); }
    }
    g.globalAlpha=1; if(k<1) requestAnimationFrame(paso); else cv.remove();
  })(t0);
  if(navigator.vibrate) try{ navigator.vibrate(30); }catch(e){}
}

/* ===== Estilos (skins) ===== */
const SKINS=["papel","neon","cine","editorial","aurora"], SKIN_K="rodaje-skin:"+location.pathname;
function skinActual(){ try{ return JSON.parse(localStorage.getItem(SKIN_K)||"{}"); }catch(e){ return {}; } }
function ponerSkin(s,aj){
  const k=skinActual(); if(s!==undefined) k.s=s; if(aj!==undefined) k.a=aj?"1":"0"; delete k.b;
  try{ localStorage.setItem(SKIN_K,JSON.stringify(k)); }catch(e){}
  const h=document.documentElement; if(k.s && k.s!="papel") h.dataset.skin=k.s; else delete h.dataset.skin;
  h.style.filter=""; h.classList.toggle("sin-aj",k.a==="0"); document.getElementById("opAjeno").setAttribute("aria-pressed",String(k.a!=="0"));
  document.querySelectorAll(".sk").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.skin==(k.s||"papel"))));
  const mt=document.querySelector('meta[name="theme-color"]'); if(mt) mt.content=getComputedStyle(h).getPropertyValue("--bg").trim()||"#f6f3ee";
}
document.getElementById("btnSkin").addEventListener("click",ev=>{ ev.stopPropagation(); const p=document.getElementById("skinpop"); p.hidden=!p.hidden; ev.currentTarget.setAttribute("aria-expanded",String(!p.hidden));
  if(!p.hidden){ const hb=document.querySelector("header").getBoundingClientRect(); p.style.top=(hb.bottom-4)+"px"; } });
document.getElementById("skinpop").addEventListener("click",ev=>{ ev.stopPropagation(); const b=ev.target.closest(".sk"); if(b) ponerSkin(b.dataset.skin); if(ev.target.closest("#opAjeno")) ponerSkin(undefined, skinActual().a==="0"); });
document.addEventListener("click",()=>{ const p=document.getElementById("skinpop"); if(!p.hidden){ p.hidden=true; document.getElementById("btnSkin").setAttribute("aria-expanded","false"); } });
ponerSkin();

render(); sincronizar(false); verificarSub();
/* Actualización del programa: al abrir, al volver a la app y al recargar los datos se busca la versión nueva; si hay, la app se reinicia sola (sin perder lo escrito: todo se guarda). */
try{ if("caches" in window) caches.keys().then(ks=>{ const k=ks.find(x=>/^(rodaje|control)-v\d+$/.test(x)); if(k){ VERS=k; try{ render(); }catch(e){} } }).catch(()=>{}); }catch(e){}
document.addEventListener("click",async ev=>{ const b=ev.target.closest&&ev.target.closest("#forzar"); if(!b) return;
  b.textContent="Actualizando…"; b.disabled=true;
  try{ const rs=await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r=>r.unregister())); }catch(e){}
  try{ const ks=await caches.keys(); await Promise.all(ks.filter(k=>k!="rodaje-cfg").map(k=>caches.delete(k))); }catch(e){}
  location.reload(); });
function revisarPrograma(){ try{ if(swReg) swReg.update().catch(()=>{}); }catch(e){} }
function recargarSiLibre(){ if(recargandoSW) return; const f=document.activeElement; if(f&&/^(TEXTAREA|INPUT)$/.test(f.tagName)){ f.addEventListener("blur",()=>setTimeout(recargarSiLibre,400),{once:true}); return; } recargandoSW=true; location.reload(); }
if("serviceWorker" in navigator && location.protocol=="https:"){ try{
  const habia=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{ swReg=r; revisarPrograma(); }).catch(()=>{});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(habia) { toast("Actualizando la app…"); setTimeout(recargarSiLibre,700); } });
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState=="visible") revisarPrograma(); });
}catch(e){} }
</script>
